    <!DOCTYPE html>
    <html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="stylesheet" href="style.css">
        <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Lexend:wght@100..900&display=swap" rel="stylesheet">
        <title>Document</title>
    </head>
    <body>
        <div class="kicker-logo">
    <a href="introduction.html">
        <img src="fotos/Untitled.png" alt="Kicker">
        Kicker
    </a>
</div>
  
        <div id="box">
            <h1>Sign Up</h1>
            <p id="ok">Create an account today!</p>
            <p>Username</p>
            <input type="username" name="user" id="username">
            <p>Email</p>
            <input type="email" name="email" id="email">
            <p>Password</p>
            <input type="password" name="password" id="password">
            <p>Confirm Password</p>
            <input type="password" name="confirmpassword" id="confirmpassword">
            <input type="button" value="Sign Up" onclick="saveData()">
                    <div id="memay">
            <p>already have one?</p>
            <a href="login.html">Log In</a>
            </div>
        </div>
    <!-- Floating Chat Button -->
    <button id="chatButton" class="corner-button" onclick="openChat()">
        💬
    </button>

    <!-- Chat Window -->
    <div id="popupBox" class="thaycongbeo">

        <!-- Header -->
        <div class="chat-header">
            <div class="bot-info">
                <div class="bot-avatar">🤖</div>
                <div>
                    <h3>Kicker AI</h3>
                    <span>● Online</span>
                </div>
            </div>

            <button class="close-button" onclick="closeChat()">&times;</button>
        </div>
<div class="chat-body" id="chatBody">
    <div class="message ai-message">
        <div class="message-name">Kicker AI</div>
        <div class="bubble">Hey! How can I help you?</div>
    </div>
</div>

<div class="chat-input">
    <input
        type="text"
        id="chatbot-input"
        placeholder="Type your message..."
    >
    <button onclick="sendMessage()">➤</button>
</div>   
<script src="storage.js"></script>   
<script>
const chatBox = document.querySelector(".thaycongbeo");
const chatButton = document.querySelector(".corner-button");
const chatBody = document.querySelector(".chat-body");
const chatInput = document.getElementById("chatbot-input");

function openChat() {
    chatBox.style.display = "flex";
}

function closeChat() {
    chatBox.style.display = "none";
}


async function sendMessage() {
    const message = chatInput.value.trim();

    if (!message) return;

    // USER MESSAGE
    const userMessage = document.createElement("div");
    userMessage.className = "message user-message";

    const userName = document.createElement("div");
    userName.className = "message-name";
    userName.textContent = "You";

    const userBubble = document.createElement("div");
    userBubble.className = "bubble";
    userBubble.textContent = message;

    userMessage.appendChild(userName);
    userMessage.appendChild(userBubble);

    chatBody.appendChild(userMessage);

    chatInput.value = "";
    chatBody.scrollTop = chatBody.scrollHeight;

    // THINKING MESSAGE
    const loadingMessage = document.createElement("div");
    loadingMessage.className = "message ai-message";

    const loadingName = document.createElement("div");
    loadingName.className = "message-name";
    loadingName.textContent = "Kicker AI";

    const loadingBubble = document.createElement("div");
    loadingBubble.className = "bubble";
    loadingBubble.textContent = "Thinking...";

    loadingMessage.appendChild(loadingName);
    loadingMessage.appendChild(loadingBubble);

    chatBody.appendChild(loadingMessage);
    chatBody.scrollTop = chatBody.scrollHeight;

    try {
        const API_KEY = "AQ.Ab8RN6IvIdfu3zhWwNqoNLZgauVaHJlaLrSdig8qW_55v1bVKw";

const response = await fetch(
    "https://generativelanguage.googleapis.com/v1beta/models/gemini-3.5-flash:generateContent",
    {
        method: "POST",

        headers: {
            "Content-Type": "application/json",
            "x-goog-api-key": API_KEY
        },

        body: JSON.stringify({
            contents: [
                {
                    parts: [
                        {
                            text: message
                        }
                    ]
                }
            ]
        })
    }
);

        const data = await response.json();
        console.log("Gemini response:", data);

        loadingMessage.remove();

        const aiMessage = document.createElement("div");
        aiMessage.className = "message ai-message";

        const aiName = document.createElement("div");
        aiName.className = "message-name";
        aiName.textContent = "Kicker AI";

        const aiBubble = document.createElement("div");
        aiBubble.className = "bubble";

        const reply =
            data.candidates?.[0]?.content?.parts?.[0]?.text ||
            "Sorry, I couldn't generate a response.";

        aiBubble.textContent = reply;

        aiMessage.appendChild(aiName);
        aiMessage.appendChild(aiBubble);

        chatBody.appendChild(aiMessage);

        chatBody.scrollTop = chatBody.scrollHeight;

    } catch (error) {
        console.error("Gemini error:", error);

        loadingBubble.textContent =
            "I can't connect to Gemini right now.";
    }
}


// =========================
// ENTER KEY
// =========================

chatInput.addEventListener("keydown", function(event) {

    if (event.key === "Enter") {
        event.preventDefault();
        sendMessage();
    }

});
</script>

    </body>
    </html>
