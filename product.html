<!-- ==========================================
     PRODUCT
========================================== -->

<main class="product-page">

    <div class="product-image">

        <img
            id="productImage"
            src=""
            alt=""
        >

    </div>


    <div class="product-info">

        <a href="introduction.html" class="back-button">
            ← Back to Collection
        </a>

        <p id="productId"></p>

        <h1 id="productName">
            Product Name
        </h1>

        <p id="productDescription">
            Product description
        </p>

        <strong id="productPrice">
            $0
        </strong>


        <!-- QUANTITY -->

        <div class="quantity-section">

            <p>Quantity</p>

            <div class="quantity-box">

                <button id="minusBtn">
                    −
                </button>

                <span id="quantity">
                    1
                </span>

                <button id="plusBtn">
                    +
                </button>

            </div>

        </div>


        <!-- BUTTONS -->

        <div class="product-actions">

            <button
                id="addCartBtn"
                class="add-cart-btn"
            >
                Add to Cart 🛒
            </button>

            <button
                id="wishlistBtn"
                class="wishlist-btn"
            >
                ♡
            </button>

        </div>

    </div>

</main>



<!-- ==========================================
     RECOMMENDED SHOES
========================================== -->

<section class="recommended-section">

    <h2>
        You May Also Like
    </h2>

    <p class="recommended-subtitle">
        More kicks you might like
    </p>


    <div
        id="recommendedProducts"
        class="recommended-grid"
    ></div>

</section>

        },

        22: {

            price: 120,
            image: "fotos/VAPOR+17+ACADEMY+FG_MG.avif",
            description: "Multi-Ground Low-Top Soccer Cleats"
        },

        23: {
            name: "Nike Mercurial Superfly",
            price: 135,
            image: "fotos/ZM+SUPERFLY+11+ELITE+AG-PRO.avif",
            description: "Artificial-Grass High-Top Soccer Cleats"
        },

        24: {
            name: "Nike Zoom Vapor Academy",
            price: 95,
            image: "fotos/ZOOM+VAPOR+16+ACADEMY+IC.avif",
            description: "Indoor/Court Soccer Shoes"
        }
    };


    // ==========================================
    // GET PRODUCT ID
    // ==========================================

    const urlParams = new URLSearchParams(
        window.location.search
    );

    const productId = urlParams.get("id");

    const product = products[productId];


    // ==========================================
    // QUANTITY
    // ==========================================

    let quantity = 1;

    const quantityText =
        document.getElementById("quantity");

    const minusBtn =
        document.getElementById("minusBtn");

    const plusBtn =
        document.getElementById("plusBtn");


    minusBtn.onclick = function () {

        if (quantity > 1) {

            quantity--;

            quantityText.textContent = quantity;

        }

    };


    plusBtn.onclick = function () {

        if (quantity < 99) {

            quantity++;

            quantityText.textContent = quantity;

        }

    };


    // ==========================================
    // DISPLAY PRODUCT
    // ==========================================

    if (!product) {

        document.body.innerHTML = `

            <div style="
                text-align:center;
                padding:200px 20px;
                font-family:Lexend;
            ">

                <h1>Product not found</h1>

                <a href="introduction.html">
                    Go back
                </a>

            </div>

        `;

    } else {

        document.getElementById("productId").textContent =
            "Product #" + productId;

        document.getElementById("productName").textContent =
            product.name;

        document.getElementById("productDescription").textContent =
            product.description;

        document.getElementById("productPrice").textContent =
            "$" + product.price.toFixed(2);

        document.getElementById("productImage").src =
            product.image;

        document.getElementById("productImage").alt =
            product.name;


        // ==========================================
        // ADD TO CART
        // ==========================================

        document.getElementById("addCartBtn").onclick = function () {

            for (let i = 0; i < quantity; i++) {

                addToCart({

                    id: Number(productId),

                    name: product.name,

                    price: product.price,

                    image: product.image

                });

            }

            alert(
                quantity +
                " × " +
                product.name +
                " added to cart!"
            );

        };


        // ==========================================
        // WISHLIST
        // ==========================================

        document.getElementById("wishlistBtn").onclick = function () {

            addToWishlist({

                id: Number(productId),

                name: product.name,

                price: product.price,

                image: product.image

            });

        };


        // ==========================================
        // RECOMMENDED PRODUCTS
        // ==========================================

        const recommendedContainer =
            document.getElementById(
                "recommendedProducts"
            );


        const productIds =
            Object.keys(products);


        // Shuffle products

        const shuffled =
            productIds.sort(
                () => Math.random() - 0.5
            );


        // Pick 4 different products

        const recommended =
            shuffled
                .filter(id => id !== productId)
                .slice(0, 4);


        recommended.forEach(id => {

            const item = products[id];


            const card =
                document.createElement("div");

            card.className =
                "recommended-card";


            card.innerHTML = `

                <a
                    href="product.html?id=${id}"
                    class="recommended-link"
                >

                    <div class="recommended-image">

                        <img
                            src="${item.image}"
                            alt="${item.name}"
                        >

                    </div>


                    <h3>
                        ${item.name}
                    </h3>

                    <p>
                        ${item.description}
                    </p>

                    <strong>
                        $${item.price.toFixed(2)}
                    </strong>

                </a>

            `;


            recommendedContainer.appendChild(card);

        });

    }
// ==========================================
// UPDATE NAVBAR
// ==========================================

updateNavbar();
</script>
